
compiler_type = "ido"

compiler_command = "tools/ido5.3/cc -O2 -mips2 -Olimit 2000 -c -Wab,-r4300_mul -G 0 -nostdinc -Xcpluscomm -non_shared -D_LANGUAGE_C -I include -I include/libultra -I include/libultra/PR -DTARGET_N64 -D_FINALROM -DF3DEX_GBI -DNDEBUG -D_MIPS_SZLONG=32"
assembler_command = "mips-linux-gnu-gcc -x assembler-with-cpp -w -nostdinc -c -G 0 -march=vr4300 -mgp32 -mfp32 -mno-abicalls -mips3 -D_LANGUAGE_ASSEMBLY -I include -I include/libultra -I include/libultra/PR -DTARGET_N64 -D_FINALROM -DF3DEX_GBI -DNDEBUG -D_MIPS_SZLONG=32"

[preserve_macros]
"_*gs?[DS]P.*" = "void"
"gs?Dma.*" = "void"
"gs?Imm.*" = "void"
"gs?MoveWd.*" = "void"
"gSetImage" = "void"
"MAX" = "void"
"MIN" = "void"
"GCCc0w0" = "void"
"GCCc0w1" = "void"
"GCCc1w0" = "void"
"GCCc1w1" = "void"
"CALC_DXT" = "void"
"GBL_.*" = "void"
"_SHIFTL" = "void"
"_SHIFTR" = "void"
"RM_.*" = "void"
OVERRIDE_FLAG_CHECK = "int"
OS_K0_TO_PHYSICAL = "int"
"G_.*" = "int"
"TEXEL.*" = "int"
"PRIMITIVE" = "int"
"BOWTIE_VAL" = "int"
"ALPHA_CVG_SEL" = "int"
"ZMODE_OPA" = "int"
"TEX_EDGE" = "int"
"LIGHT_*." = "int"
"FORCE_BL" = "int"
"CVG_DST_FULL" = "int"
"CVG_X_ALPHA" = "int"
"AA_EN" = "int"
"CLR_ON_CVG" = "int"
"ZMODE_XLU" = "int"

[decompme.compilers]
"ido5.3/cc" = "ido5.3"